services:
  db:
    image: postgres:16-alpine
    container_name: en-flow-db
    environment:
      POSTGRES_DB: enflow
      POSTGRES_USER: enflow
      POSTGRES_PASSWORD: enflow
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enflow -d enflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: en-flow-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    environment:
      APP_NAME: En Flow API
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      BACKEND_CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+psycopg://enflow:enflow@db:5432/enflow
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: en-flow-frontend
    command: npm run dev
    working_dir: /app
    environment:
      VITE_API_URL: /api/v1
      VITE_DEV_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
